<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Infanta Flood Simulation</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        #timer-box { position: absolute; top: 20px; left: 20px; background: white; padding: 15px; font-family: Arial, sans-serif; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.5); z-index: 1; }
    </style>
</head>
<body>

<div id="timer-box">
    <h2>Storm Timeline</h2>
    <p>Elapsed Time: <strong>Hour <span id="hour-display">1</span></strong></p>
</div>

<div id="map"></div>

<script>
    // 1. Insert your Mapbox Token here
    mapboxgl.accessToken = 'pk.eyJ1Ijoia3R4Y2FzIiwiYSI6ImNtcHVpc2JubzE1OXAyeHFvNmFybGwzZmIifQ.F4ACQ0OIPX9RMlu5C6gEiQ';

    // 2. Initialize the Map centered on Infanta
    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/satellite-streets-v12',
        center: [121.65, 14.75],
        zoom: 11,
        pitch: 45
    });

    map.on('load', () => {
        // Add 3D Terrain
        map.addSource('mapbox-dem', {
            'type': 'raster-dem',
            'url': 'mapbox://mapbox.mapbox-terrain-dem-v1',
            'tileSize': 512,
            'maxzoom': 14
        });
        map.setTerrain({ 'source': 'mapbox-dem', 'exaggeration': 1.5 });

        // Load your GeoJSON
        map.addSource('flood-data', {
            type: 'geojson',
            data: 'Infanta_Flood.geojson' // Make sure this matches your exact file name!
        });

        // Add the water to the map
        map.addLayer({
            id: 'flood-layer',
            type: 'fill',
            source: 'flood-data',
            paint: {
                'fill-color': '#0080ff',
                'fill-opacity': 0.6
            },
            // Start by ONLY showing Hour_1 using the 'layer' column
            filter: ['==', ['get', 'layer'], 'Hour_1'] 
        });

        // ---------------------------------------------------------
        // THE ANIMATION CLOCK
        // ---------------------------------------------------------
        let currentHour = 1;
        const maxHours = 24; // Change this if you exported a different number of hours!

        setInterval(() => {
            // Move the clock forward
            currentHour++;
            
            // Loop back to the start if we hit the max
            if (currentHour > maxHours) {
                currentHour = 1; 
            }
            
            // Create the exact text string (e.g., "Hour_2")
            let currentName = 'Hour_' + currentHour;
            
            // Update the map to show the new hour using the 'layer' column
            map.setFilter('flood-layer', ['==', ['get', 'layer'], currentName]);
            
            // Update the white text box on the screen
            document.getElementById('hour-display').innerText = currentHour;
            
        }, 1000); // 1000 milliseconds = 1 second per frame
    });
</script>
</body>
</html>
